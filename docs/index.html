    for (let k = 0; k < w * h * 4; k += 4) { ic.data[k] = C.data[k]; ic.data[k + 1] = C.data[k + 1]; ic.data[k + 2] = C.data[k + 2]; ic.data[k + 3] = M.data[k + 3]; }

// ---------- backgrounds (screen-space, scaled for the display)
const patterns = {};
function pattern(ctx, kind) {
  if (patterns[kind]) return patterns[kind];

    const s = Math.round(10 * d), t = mk(2 * s, 2 * s), x = t.getContext("2d");
    x.fillStyle = "#ffffff"; x.fillRect(0, 0, 2 * s, 2 * s); x.fillStyle = "#cccccc"; x.fillRect(0, 0, s, s); x.fillRect(s, s, s, s);

  const P = Math.round(24 * d), t = mk(P, P), x = t.getContext("2d"), im = x.createImageData(P, P), n = 4;
  for (let py = 0; py < P; py++) for (let px = 0; px < P; px++) {

function fillBg(ctx, w, h, plain, P) {

  if (plain || !P) return;

  ctx.fillStyle = bg === "teal" ? TEAL : bg === "black" || bg === "matte" ? "#000" : bg === "white" ? "#fff" : pattern(ctx, bg);

}
// slider position is a fraction of the image width (not of the canvas)
const splitX = (P, W) => Math.min(W, Math.max(0, st.ox + st.split * P.w * st.s));
// side "O" = original, "C" = cutout (or matte)
const layer = (P, side) => side === "O" ? P.orig : (st.bg === "matte" ? P.mat : P.cut);
const label = side => side === "O" ? "Original" : (st.bg === "matte" ? "Matte" : "Cutout");

// ---------- viewer
const stage = document.getElementById("stage");
let views = [], fitPending = true, cur = null;
function buildStage() {
  stage.innerHTML = ""; views = [];
  stage.classList.toggle("side", st.mode === "side");
  const n = st.mode === "side" ? 2 : 1;
  for (let v = 0; v < n; v++) {
    const box = document.createElement("div"); box.className = "view";
    const c = document.createElement("canvas"); box.appendChild(c);
    const l = document.createElement("div"); l.className = "lab"; box.appendChild(l);
    if (st.mode === "slider") { const r = document.createElement("div"); r.className = "lab r"; r.textContent = label("C"); box.appendChild(r); }
    stage.appendChild(box); views.push({ c, l, side: v === 0 ? "O" : "C" });
    bindPanZoom(c);
  }
  resize();
}
function resize() {
  for (const v of views) { const r = v.c.getBoundingClientRect(); v.c.width = Math.max(1, Math.round(r.width * devicePixelRatio)); v.c.height = Math.max(1, Math.round(r.height * devicePixelRatio)); }
  fitPending = true; draw();
}
function fit(P) { const c = views[0].c, s = Math.min(c.width / P.w, c.height / P.h) * 0.98; st.s = s; st.ox = (c.width - P.w * s) / 2; st.oy = (c.height - P.h * s) / 2; st.zoom = "fit"; }

async function draw() {
  if (!st.viewing || !views.length) return;
  const i = st.i, P = await prepare(i);
  if (i !== st.i || !st.viewing) return;
  cur = P;
  if (fitPending) { fit(P); fitPending = false; refreshUI(); }
  for (const v of views) {
    const ctx = v.c.getContext("2d"), W = v.c.width, H = v.c.height;
    let side = v.side;
    if (st.mode === "flicker") side = (st.hold || st.swap) ? "C" : "O";
    else if (st.mode === "side" && st.hold) side = side === "O" ? "C" : "O";
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    if (st.mode === "slider") {
      fillBg(ctx, W, H, true); ctx.setTransform(st.s, 0, 0, st.s, st.ox, st.oy); ctx.imageSmoothingEnabled = st.s < 1; ctx.drawImage(layer(P, "O"), 0, 0);
      const sx = splitX(P, W), d = devicePixelRatio;
      ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.save(); ctx.beginPath(); ctx.rect(sx, 0, W - sx, H); ctx.clip();
      fillBg(ctx, W, H, false, P); ctx.setTransform(st.s, 0, 0, st.s, st.ox, st.oy); ctx.imageSmoothingEnabled = st.s < 1; ctx.drawImage(layer(P, "C"), 0, 0); ctx.restore();
      ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = "#000000a0"; ctx.fillRect(sx - 2 * d, 0, 4 * d, H); ctx.fillStyle = "#d6d6da"; ctx.fillRect(sx - d, 0, 2 * d, H);
      const R = (TOUCH ? 16 : 12) * d;
      ctx.fillStyle = "#d6d6da"; ctx.beginPath(); ctx.arc(sx, H / 2, R, 0, 7); ctx.fill();
      ctx.strokeStyle = "#111112"; ctx.lineWidth = 1.75 * d; ctx.lineCap = ctx.lineJoin = "round"; ctx.beginPath();
      ctx.moveTo(sx - 2 * d, H / 2 - 4 * d); ctx.lineTo(sx - 6 * d, H / 2); ctx.lineTo(sx - 2 * d, H / 2 + 4 * d);
      ctx.moveTo(sx + 2 * d, H / 2 - 4 * d); ctx.lineTo(sx + 6 * d, H / 2); ctx.lineTo(sx + 2 * d, H / 2 + 4 * d); ctx.stroke();

    } else {
      fillBg(ctx, W, H, side === "O", P); ctx.setTransform(st.s, 0, 0, st.s, st.ox, st.oy); ctx.imageSmoothingEnabled = st.s < 1; ctx.imageSmoothingQuality = "high";
      ctx.drawImage(layer(P, side), 0, 0);
    }
    v.l.textContent = label(side) + (st.mode === "flicker" && !st.flickOn ? " · paused (F)" : "");

}
// Pointer input. Mouse: slider = left-drag moves the divider (right/middle/Shift-drag pans); other views drag to pan; wheel zooms.
// Touch: one finger = divider in slider, pan in other views; two fingers = pinch zoom + pan; double tap = fit.
function bindPanZoom(c) {
  const pts = new Map();
  let drag = null, pinch = null, lastTap = 0;
  const toCanvas = e => { const r = c.getBoundingClientRect(); return [(e.clientX - r.left) * devicePixelRatio, (e.clientY - r.top) * devicePixelRatio]; };
  const setSplit = x => { st.split = Math.min(1, Math.max(0, (x - st.ox) / (cur.w * st.s))); };
  const startPinch = () => {
    const [a, b] = [...pts.values()];
    pinch = { d: Math.hypot(a[0] - b[0], a[1] - b[1]) || 1, mx: (a[0] + b[0]) / 2, my: (a[1] + b[1]) / 2, s: st.s, ox: st.ox, oy: st.oy };

  };
  c.addEventListener("pointerdown", e => {
    if (!cur) return;
    swipeId++;
    const p = toCanvas(e);
    pts.set(e.pointerId, p);
    try { c.setPointerCapture(e.pointerId); } catch (err) {}
    c.classList.add("drag");
    if (pts.size === 2) { startPinch(); return; }
    if (pts.size > 2) return;
    if (e.pointerType !== "mouse") {
      const now = performance.now();
      if (now - lastTap < 300) { fitPending = true; draw(); lastTap = 0; return; }
      lastTap = now;
    }
    const split = st.mode === "slider" && (e.pointerType !== "mouse" || (e.button === 0 && !e.shiftKey));
    drag = { x: p[0], y: p[1], ox: st.ox, oy: st.oy, split };
    if (split) { setSplit(p[0]); draw(); }
  });
  c.addEventListener("pointermove", e => {
    if (!pts.has(e.pointerId)) return;
    const p = toCanvas(e); pts.set(e.pointerId, p);

      const [a, b] = [...pts.values()], d = Math.hypot(a[0] - b[0], a[1] - b[1]) || 1, mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2;
      const ns = Math.min(16, Math.max(0.02, pinch.s * d / pinch.d));
      st.ox = mx - (pinch.mx - pinch.ox) * ns / pinch.s; st.oy = my - (pinch.my - pinch.oy) * ns / pinch.s; st.s = ns;

    if (!drag) return;

  c.addEventListener("pointercancel", up);

    e.preventDefault();
    const [mx, my] = toCanvas(e);

  c.addEventListener("contextmenu", e => e.preventDefault());
}

// ---------- navigation & controls
function step(dir) { const p = view.indexOf(st.i); return view[((p < 0 ? 0 : p) + dir + view.length) % view.length]; }
let gridScroll = 0;
function openViewer(i) { gridScroll = scrollY; st.viewing = true; document.body.classList.add("viewing"); go(i, true); buildStage(); refreshUI(); scrollTo({ top: 0 }); }
function closeViewer() { st.viewing = false; document.body.classList.remove("viewing"); stage.innerHTML = ""; views = []; buildGrid(); refreshUI();
  const t = grid.querySelector(`.tile[data-i="${st.i}"]`); if (t) t.scrollIntoView({ block: "center" }); else scrollTo({ top: gridScroll }); }
let swipeId = 0;
const END = 0.75;  // where the divider rests after the swipe, as a fraction of the image width
function swipeIn(i) {  // slider opens on the original, the divider runs all the way left, then bounces back to END
  const id = ++swipeId;
  if (st.mode !== "slider") return;
  st.split = 1;
  prepare(i).then(() => {
    if (id !== swipeId || st.i !== i || st.mode !== "slider") return;
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) { st.split = END; draw(); return; }
    const t0 = performance.now(), A = 650, B = 600, c1 = 1.2, c3 = c1 + 1;
    const tick = now => {
      if (id !== swipeId) return;
      const t = now - t0;
      if (t < A) { const k = t / A; st.split = 1 - (k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2); }
      else { const k = Math.min(1, (t - A) / B); st.split = END * (1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2)); }
      draw();
      if (t < A + B) requestAnimationFrame(tick); else { st.split = END; draw(); }
    };
    requestAnimationFrame(tick);
  });
}
function go(i, open) { st.i = i; fitPending = true; st.flickOn = true; if (open) swipeIn(i); else swipeId++; refreshUI(); draw(); prepare(step(1)); }
function setBg(bg) { st.bg = bg; savePrefs(); if (!st.viewing) buildGrid(); else if (st.mode === "slider") buildStage(); refreshUI(); draw(); }
function setMode(m) { st.mode = m; st.swap = false; st.hold = false; st.flickOn = true; savePrefs(); buildStage(); refreshUI(); }
function placeKnobs() {
  document.querySelectorAll(".seg").forEach(seg => {
    let k = seg.querySelector(".knob"); if (!k) { k = document.createElement("span"); k.className = "knob"; seg.prepend(k); }
    const on = seg.querySelector("button.on");
    if (!on || !seg.offsetParent) { k.style.opacity = 0; return; }
    const first = !k.style.width || k.style.width === "0px" || k.style.opacity !== "1";  // first show: no grow-from-zero animation
    if (first) k.style.transition = "none";
    k.style.opacity = 1; k.style.width = on.offsetWidth + "px"; k.style.transform = `translateX(${on.offsetLeft}px)`;

}
function refreshUI() {
  const set = (sel, key, val) => document.querySelectorAll(sel).forEach(b => b.classList.toggle("on", b.dataset[key] === val));
  set("[data-bg]", "bg", st.bg); set("[data-mode]", "mode", st.mode); set("[data-tile]", "tile", st.tile);
  set("[data-filter]", "filter", st.filter); set("[data-zoom]", "zoom", st.zoom);
  const d = IMAGES[st.i];
  const vt = document.getElementById("vtitle"); vt.replaceChildren();
  if (st.viewing) {
    const a = document.createElement("div"), b = document.createElement("div"); a.className = "vt"; b.className = "why";
    a.textContent = `${view.indexOf(st.i) + 1}/${view.length} · ${isImp(d) ? (COPY.badge || "★ Impressive") + " · " : ""}${d.title} · ${d.cat || ""} · ${d.w}×${d.h} ${d.kind}`;
    b.textContent = d.pick.charAt(0).toUpperCase() + d.pick.slice(1); vt.append(a, b);
  }
  document.getElementById("vsrc").href = SRC_PAGE + "#" + slug(d.id);
  placeKnobs();
}
document.querySelectorAll("[data-bg]").forEach(b => b.onclick = () => setBg(b.dataset.bg));
document.querySelectorAll("[data-mode]").forEach(b => b.onclick = () => setMode(b.dataset.mode));
document.querySelectorAll("[data-tile]").forEach(b => b.onclick = () => { st.tile = b.dataset.tile; savePrefs(); buildGrid(); refreshUI(); });
document.querySelectorAll("[data-zoom]").forEach(b => b.onclick = () => { if (!cur) return; if (b.dataset.zoom === "fit") fit(cur); else { zoomTo(+b.dataset.zoom); st.zoom = b.dataset.zoom; } refreshUI(); draw(); });
document.querySelectorAll("[data-filter]").forEach(b => b.onclick = () => { st.filter = b.dataset.filter; buildGrid(); refreshUI(); });
document.getElementById("back").onclick = closeViewer;
document.getElementById("prev").onclick = () => go(step(-1));
document.getElementById("next").onclick = () => go(step(1));
document.getElementById("prev2").onclick = () => go(step(-1));
document.getElementById("next2").onclick = () => go(step(1));
setInterval(() => { if (st.viewing && st.mode === "flicker" && st.flickOn && !st.hold) { st.swap = !st.swap; draw(); } }, 650);
const BGKEYS = ["teal", "checker", "stripes", "black", "white", "matte"];
addEventListener("keydown", e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key >= "1" && e.key <= "6") return setBg(BGKEYS[+e.key - 1]);
  if (!st.viewing) return;
  if (e.key === "Escape") closeViewer();
  else if (e.key === "ArrowRight") go(step(1));
  else if (e.key === "ArrowLeft") go(step(-1));
  else if (e.key === "s") setMode("side"); else if (e.key === "l") setMode("slider");
  else if (e.key === "f") { if (st.mode === "flicker") { st.flickOn = !st.flickOn; draw(); } else setMode("flicker"); }
  else if (e.key === " ") { e.preventDefault(); if (!st.hold) { st.hold = true; draw(); } }
});
addEventListener("keyup", e => { if (e.key === " " && st.viewing) { st.hold = false; draw(); } });
addEventListener("resize", () => { if (st.viewing) resize(); placeKnobs(); restFns.forEach(f => f()); });
document.fonts && document.fonts.ready.then(placeKnobs);

buildGrid(); refreshUI();
</script>
